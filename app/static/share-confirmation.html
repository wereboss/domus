<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Saved to Family Inbox - Domus</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      background: #0f172a;
    }
    .confirm-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }
    .check-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #10b981;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="confirm-card">
    <div class="check-circle" id="confirm-icon">✓</div>
    <h2 style="margin: 0 0 8px 0; font-size: 1.3rem; font-weight: 700;" id="confirm-title">Saved to Family Inbox!</h2>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px;" id="confirm-desc">
      Captured safely. You or your family can review and approve it anytime.
    </p>

    <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 16px;" id="countdown-text">
      Returning in 2s...
    </div>

    <a href="/" style="display: block; width: 100%; height: 48px; line-height: 48px; background: #2563eb; color: white; border-radius: 10px; font-weight: 600; text-decoration: none;" id="confirm-btn">
      Open Domus Now
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const isEmpty = params.get("status") === "empty";

    let timeLeft = isEmpty ? 4 : 2;

    if (isEmpty) {
      document.getElementById("confirm-icon").innerText = "ℹ️";
      document.getElementById("confirm-icon").style.background = "#f59e0b";
      document.getElementById("confirm-icon").style.boxShadow = "0 4px 16px rgba(245, 158, 11, 0.4)";
      document.getElementById("confirm-title").innerText = "File Share Restricted by Android";
      document.getElementById("confirm-desc").innerText = "Android Chrome restricted direct file sharing into PWAs (Chromium Bug 561877898). Please open Domus and tap '📷 Upload Photo / Doc' directly!";
      document.getElementById("confirm-btn").innerText = "Open Domus & Upload Photo";
    }

    // Auto-close if launched as a share target window, or redirect to home
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        document.getElementById("countdown-text").innerText = `Returning in ${timeLeft}s...`;
      }
    }, 1000);

    setTimeout(() => {
      clearInterval(interval);
      try {
        window.close();
      } catch (e) {}
      // If window.close() is blocked by browser security, redirect to app root
      window.location.href = "/";
    }, isEmpty ? 4000 : 1800);
  </script>
</body>
</html>
